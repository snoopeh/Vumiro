name: Publish ScreenTask client
on:
  push:
    tags: ['client-v*']
permissions:
  contents: write
jobs:
  client-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Verify client tag matches the application
        shell: pwsh
        run: |
          [xml]$project = Get-Content ScreenTask.Client/ScreenTask.Client.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "client-v$version") { throw 'Client tag and version differ.' }
          [xml]$helper = Get-Content ScreenTask.Client.Updater/ScreenTask.Client.Updater.csproj
          if ([string]$helper.Project.PropertyGroup.Version -ne $version) { throw 'Client updater and app versions differ.' }
      - name: Build portable client and update helper
        shell: pwsh
        run: ./scripts/Build-Client.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/dist/client-release"
      - name: Publish client download and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/client-release/ScreenTask-client-win-x64.zip dist/client-release/SHA256SUMS.txt --title "ScreenTask Client $env:GITHUB_REF_NAME" --generate-notes --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Client release publication failed.' }
