name: Build Vumiro
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet build Vumiro.sln -c Release --nologo
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem Vumiro.Client/WebServer,cloudflare,Vumiro.Linux -File | Where-Object { $_.Extension -in '.js','.mjs','.cjs' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.Name)" }
          }
      - name: Run account and identity tests
        shell: pwsh
        run: |
          node --test tests/account-client.test.mjs tests/identity-recovery.test.mjs
          Push-Location cloudflare
          npm ci
          npm test
          Pop-Location
      - name: Build and validate Windows update transition
        shell: pwsh
        run: |
          ./scripts/Build-Client.ps1 -OutputDirectory "$env:RUNNER_TEMP/client-packages"
          ./scripts/Test-ClientPackages.ps1 -OutputDirectory "$env:RUNNER_TEMP/client-packages"
  linux-packaging:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Vumiro.Linux/package-lock.json
      - name: Install Linux package builders
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm libarchive-tools
      - name: Build Linux packages
        working-directory: Vumiro.Linux
        run: |
          npm ci
          node ../scripts/Build-Linux.mjs
