name: Build Vumiro
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet build Vumiro.sln -c Release --nologo
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem Vumiro.Client/WebServer,cloudflare -File | Where-Object { $_.Extension -in '.js','.mjs' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.Name)" }
          }
