name: Build Vumiro
on:
  push:
    branches: [main]
    paths:
      - 'Vumiro.Client/**'
      - 'Vumiro.Client.Updater/**'
      - 'Vumiro.Linux/**'
      - 'cloudflare/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'Vumiro.sln'
  pull_request:
    paths:
      - 'Vumiro.Client/**'
      - 'Vumiro.Client.Updater/**'
      - 'Vumiro.Linux/**'
      - 'cloudflare/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'Vumiro.sln'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/client-checks.yml
  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet build Vumiro.sln -c Release --nologo
      - run: dotnet run --project tests/OAuthCallbackChecks/OAuthCallbackChecks.csproj -c Release
      - name: Native check summary
        shell: pwsh
        run: Add-Content $env:GITHUB_STEP_SUMMARY 'Windows Release build and native invariants passed. Distribution archives are built only when releasing.'
  linux-smoke:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Vumiro.Linux/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('Vumiro.Linux/package-lock.json') }}
      - name: Install headless Electron dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libatk-bridge2.0-0 libcups2
      - run: npm ci --prefix Vumiro.Linux
      - name: Build unpacked app without distribution archives
        run: node scripts/Build-Linux.mjs --unpacked
      - name: Run offline packaged startup and UI regressions
        shell: bash
        run: xvfb-run -a node scripts/Test-LinuxSmoke.mjs 2>&1 | tee dist/linux-release/linux-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-report
          overwrite: true
          path: dist/linux-release/linux-smoke.log
          if-no-files-found: ignore
          retention-days: 14
