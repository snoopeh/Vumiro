<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Choose what to share</title>
  <style>
    :root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif;background:#0b0b0c;color:#f8f8f8}*{box-sizing:border-box}body{margin:0;padding:22px}h1{font-size:19px;margin:0 0 4px}p{margin:0;color:#a4a4ad;font-size:12px}.sources{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:20px 0}.source{min-width:0;padding:8px;border:1px solid #303036;border-radius:10px;background:#151518;color:inherit;text-align:left;cursor:pointer}.source:hover,.source:focus-visible{border-color:#e11d2e;outline:2px solid #e11d2e;outline-offset:1px}.source img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#080809;border-radius:6px}.source span{display:block;margin:8px 2px 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.empty{padding:24px;border:1px solid #303036;border-radius:10px;color:#a4a4ad;text-align:center}.actions{display:flex;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid #29292e}button{padding:8px 14px;border:1px solid #37373f;border-radius:7px;background:#1d1d22;color:inherit;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#29292f}.loading{color:#92929c;padding:16px 4px}
  </style>
</head>
<body>
  <h1>Choose what to share</h1>
  <p>Select a screen or window. Nothing is shared until you choose a source.</p>
  <div id="sources" class="sources"><div class="loading">Looking for available screens and windows…</div></div>
  <div class="actions"><button id="cancel" type="button">Cancel</button></div>
  <script src="capture-picker.js"></script>
</body>
</html>
