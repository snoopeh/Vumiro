<!doctype html>
<html lang="en">
  <body style="margin:0;background:#171416;color:#f5efea;font-family:Arial,sans-serif">
    <main style="max-width:480px;margin:32px auto;padding:32px">
      <h1 style="color:#ef625e;font-size:28px">Vumiro</h1>
